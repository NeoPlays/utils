networks:
  consolidations:

services:
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    environment:
      BEACON_NODE: "https://ethereum-hoodi-beacon-api.publicnode.com"
      KEYS_DIR: "/keys"
      POLL_INTERVAL: "300"
      METRICS_PORT: "8000"
    volumes:
      - ./keys:/keys:ro
    ports:
      - "8000:8000"
    networks:
      - consolidations
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - consolidations
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - consolidations
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
